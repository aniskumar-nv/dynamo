#
# Power Agent helm values override — NVML actuator pass.
# Use with: helm upgrade --install power-agent deploy/helm/charts/power-agent \
#               --namespace dynamo-power-test -f 10-power-agent-values-nvml.yaml

image:
  # IMAGE NOTE — ephemeral ttl.sh tag (24h TTL). If `helm install` fails
  # with ImagePullBackOff this image likely expired; rebuild + push using
  # "examples/multi-dgd-live-test/README.md § Path-B prerequisites".
  # Production followup: switch to nvcr.io/nvidia/ai-dynamo/power-agent:vX.Y.Z
  # once the NGC build lands and Findings #1/#2/#5/#6 are addressed
  # upstream (Dockerfile DCGM tag + bindings path + missing logger.py shim).
  # This NVML-pass build used DCGM 3.3.9 bindings (no DCGM-mode in
  # this pass, so the 3.3.9 vs 4.5+ struct gap is irrelevant here).
  repository: ttl.sh/dynamo-pa-4c3c606
  tag: "24h"
  pullPolicy: IfNotPresent

# ttl.sh is anonymous; no imagePullSecret needed.
imagePullSecrets: []

agent:
  actuator: nvml
  # A100 SXM4 (80 GB) recommended safe default per chart values.yaml.
  # 70% of 400 W TDP. Used when:
  #   - multi-pod conflict cannot agree on a cap (B5 path)
  #   - a managed GPU has no annotation (B4 / cold-start path)
  safeDefaultWatts: 280
  prometheusPort: 9100

# Standard NVIDIA Container Toolkit injection. Matches the chart default.
runtimeClassName: nvidia
env:
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

nodeSelector:
  # Pin to the test node ONLY (otherwise the DS schedules on every GPU
  # node and clobbers other users' caps).
  nvidia.com/gpu.present: "true"
  power-test/node: "target"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

rbac:
  # Cluster-scoped RBAC for this test. The chart now correctly wires
  # `--namespace=$(POD_NAMESPACE)` when `namespaceRestricted: true`
  # (deploy/helm/charts/power-agent/templates/daemonset.yaml), so
  # namespace-restricted mode is a valid alternative. Cluster-scoped is
  # kept here so the single shared DaemonSet observes worker pods without
  # re-templating per namespace — it is a deliberate choice, not a
  # workaround for the old (now-fixed) missing-`--namespace` chart bug.
  namespaceRestricted: false

daemonset:
  enabled: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

state:
  hostPath: /var/lib/dynamo-power-agent-test

# The chart default limits.memory is now 256Mi (deploy/helm/charts/
# power-agent/values.yaml), which matches what we set here. We keep an
# explicit block because this live test runs repeated
# `kubectl exec -- python -c "..."` probes alongside the agent: importing
# the kubernetes client library inside the pod OOM-killed the agent at the
# old 128Mi default on 2026-05-21 (lastState.terminated.reason=OOMKilled).
# 256Mi gives headroom for those probes.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi
